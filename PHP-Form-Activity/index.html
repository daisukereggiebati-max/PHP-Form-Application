<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Information Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Student Information Form</h1>

        <form action="process.php" method="POST">

            <label for="name">
                Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
            >

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
            >

            <label for="year_level">
                Year Level:
            </label>

            <select
                id="year_level"
                name="year_level"
            >

                <option value="">
                    Select Year Level
                </option>

                <option value="1st Year">
                    1st Year
                </option>

                <option value="2nd Year">
                    2nd Year
                </option>

                <option value="3rd Year">
                    3rd Year
                </option>

                <option value="4th Year">
                    4th Year
                </option>

            </select>

            <button type="submit">
                Submit
            </button>

        </form>

    </div>

</body>

</html>
